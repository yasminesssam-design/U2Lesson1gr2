<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>لعبة الجمع الرأسي</title>
<style>
:root{--b1:#e0f7fa;--b2:#fff3e0;--card:#fff;--tx:#1b2a49;--pri:#ff7043;--ok:#2e9e5b;--bad:#e53935;--tc:#ff7043;--uc:#26a69a;--soft:#f1f5f9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--b1:#12263a;--b2:#2a1c3a;--card:#1f2f46;--tx:#f1f5ff;--soft:#2b3d57}}
:root[data-theme=dark]{--b1:#12263a;--b2:#2a1c3a;--card:#1f2f46;--tx:#f1f5ff;--soft:#2b3d57}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:var(--tx);background:var(--b1);background:linear-gradient(135deg,var(--b1),var(--b2));min-height:100vh;font-size:20px}
#app{max-width:620px;margin:auto;padding:12px}
.logo{display:flex;align-items:center;justify-content:center;gap:8px;margin:4px auto 10px;padding:6px 18px;border-radius:40px;background:linear-gradient(90deg,#ec407a,#ab47bc);color:#fff;width:max-content;font-weight:800;box-shadow:0 4px 12px #0003;font-size:18px}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:0 6px 18px #0002;margin-bottom:12px;text-align:center}
h1,h2{margin:6px 0}h1{font-size:30px;color:var(--pri)}
.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-weight:700;font-size:17px}
.pill{background:var(--soft);border-radius:20px;padding:4px 12px}
.prog{height:12px;background:var(--soft);border-radius:8px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:linear-gradient(90deg,#ffca28,#ff7043);transition:width .5s}
button{font:inherit;font-weight:800;border:0;border-radius:16px;padding:12px 20px;background:var(--pri);color:#fff;cursor:pointer;box-shadow:0 4px 0 #0003;margin:4px}
button:active{transform:translateY(3px);box-shadow:none}button.g{background:var(--ok)}button.s{background:#7e57c2}
input.nm{font:inherit;font-size:24px;text-align:center;padding:12px;border-radius:14px;border:3px solid var(--pri);width:90%;margin:12px 0;background:var(--card);color:var(--tx)}
table.col{direction:ltr;margin:10px auto;border-collapse:collapse;font-size:38px;font-weight:800}
.col th{font-size:15px;padding:4px 14px;color:#fff}.col th:first-child{background:var(--tc);border-radius:10px 0 0 0}.col th:last-child{background:var(--uc);border-radius:0 10px 0 0}
.col td{width:70px;height:56px;text-align:center;border:2px solid var(--soft)}.col tr.rs td{border-top:4px solid var(--tx);color:var(--ok)}
.col td.h{background:#ffe08266;outline:3px solid #ffb300}.col td.pl{width:30px;border:0;font-size:30px}
.bl{display:flex;direction:ltr;gap:20px;justify-content:center;margin:8px}.bl>div{display:flex;gap:4px;align-items:flex-end;flex-wrap:wrap;justify-content:center;width:46%;min-height:60px;background:var(--soft);border-radius:12px;padding:6px}
.rod{width:11px;height:56px;background:var(--tc);border-radius:3px}.cube{width:13px;height:13px;background:var(--uc);border-radius:3px}
.ans{font-size:40px;font-weight:900;min-height:64px;border:3px dashed var(--pri);border-radius:16px;margin:8px auto;width:150px;line-height:58px;direction:ltr}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;direction:ltr;max-width:320px;margin:auto}.pad button{font-size:28px;padding:10px;margin:0;background:#5c6bc0}
.msg{min-height:34px;font-weight:800;font-size:21px}.ok{color:var(--ok)}.no{color:var(--bad)}
.wp{font-size:21px;line-height:1.7;background:var(--soft);border-radius:14px;padding:10px}.sec{font-size:15px;opacity:.75}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.pop{animation:pp .5s}@keyframes pp{50%{transform:scale(1.15);background:#c8f7d4}}
.fx{position:fixed;top:-40px;font-size:30px;z-index:9;pointer-events:none;animation:fl 2.2s linear forwards}@keyframes fl{to{transform:translateY(110vh) rotate(360deg)}}
.ov{position:fixed;inset:0;background:#000a;z-index:10;display:flex;align-items:center;justify-content:center}.ov .card{max-width:340px;animation:pp .6s}.big{font-size:80px}
</style></head><body><div id="app"></div>
<script>
const D='٠١٢٣٤٥٦٧٨٩',ar=n=>String(n).replace(/\d/g,d=>D[d]),app=document.getElementById('app');
const S=[["أمثلة الدرس","15+24 13+74 12+33 40+53 32+5 14+4 22+7 40+6"],
["أمثلة متنوعة","42+13 50+30 61+7 64+5 15+52 20+63 85+3 44+2 17+32 32+40 80+6 91+7 33+62 50+17 23+5 82+6"],
["تمرين ٣ (١)","12+32 52+43 40+28 60+10 54+20 24+2 3+36 70+3"],
["تمرين ٣ (٢)","13+21 38+51 42+37 52+36 41+28 50+30 40+47 36+23 27+20 80+15 32+7 2+25 10+8 9+40 8+70 6+43 13+5 4+25 22+2 31+8"],
["تمرين ٣ (٣)","15+42 75+11 13+4 35+3 63+23 27+52 59+20 70+10 40+12 30+20 56+1 70+8 63+5 60+9 34+4 74+5"],
["تمرين ٣ (٤)","34+11 14+42 29+50 66+33 55+40 70+16 82+17 43+26 73+14 38+50 25+3 17+2 32+4 30+6 74+4 51+7 83+6 50+4 81+8 66+3"],
["صِل النواتج المتساوية","35+40 50+40 65+21 9+60 83+3 54+21 80+10 33+36"],
["اختبر نفسك","25+34 14+50 7+21 65+2 30+60 70+6 31+38"],
["تقييم","21+36 40+50 84+2 70+13 7+42 11+25 60+8 33+44 10+18 62+6"]];
const W=[["سلة بها ٢٨ تفاحة و٣١ برتقالة. ما إجمالي عدد ثمار الفاكهة؟",28,31,"ثمرة"],["اشترى محمود علبة ألوان بـ ٢٥ جنيهًا وكراسة رسم بـ ١٣ جنيهًا. كم يدفع للبائع؟",25,13,"جنيهًا"],["توجد ٣٢ سمكة ثم أُضيف إليها ٧ سمكات. ما إجمالي عدد الأسماك؟",32,7,"سمكة"],["لدى سارة ٦ أقلام واشترت علبة بها ١٢ قلمًا. كم قلمًا مع سارة؟",6,12,"قلمًا"],["معك ٤٣ قطعة حلوى ثم حصلت على ٢٦ قطعة أخرى. ما إجمالي قطع الحلوى؟",43,26,"قطعة"],["صعد الأتوبيس ٢٥ شخصًا ثم انضم إليهم ٢٢ شخصًا. ما العدد الكلي للركاب؟",25,22,"راكبًا"],["مع مريم ٥٠ ملصقًا ومع أختها ٤٥ ملصقًا. ما إجمالي الملصقات؟",50,45,"ملصقًا"],["صندوق به ٢٠ لعبة والآخر به ٣٠ لعبة. ما إجمالي الألعاب؟",20,30,"لعبة"],["اشترت دعاء كتابًا بـ ٤٢ جنيهًا وقلمًا بـ ٧ جنيهات. كم تدفع؟",42,7,"جنيهًا"],["مع باسم ٨٣ جنيهًا وأعطاه والده ٥ جنيهات. كم جنيهًا معه الآن؟",83,5,"جنيهًا"],["صعدت ٦ درجات من السلم ويتبقى ٣٠ درجة. كم درجة في السلم كله؟",6,30,"درجة"],["فصل به ٣١ ولدًا و٣٨ بنتًا. كم عدد تلاميذ الفصل؟",31,38,"تلميذًا"],["يوجد ٣٠ لعبة في متجر و٢٤ لعبة في متجر آخر. كم لعبة في المتجرين معًا؟",30,24,"لعبة"]];
const P=[];S.forEach(([s,t])=>t.split(' ').forEach(x=>{const[a,b]=x.split('+').map(Number);P.push({s,a,b})}));
W.forEach(w=>P.push({s:'مسائل كلامية',t:w[0],a:w[1],b:w[2],u:w[3]}));
const L=[{n:'الفضي',i:'🥈',m:0},{n:'الذهبي',i:'🥇',m:15},{n:'الألماسي',i:'💎',m:40}];
let G={name:'',score:0,ok:0,i:0,tries:0,buf:'',mode:'game',ex:[],es:0,lock:0,lvl:0,ls:0};
const rv=s=>[...s].reverse().join('');const lv=()=>L.reduce((r,l,i)=>G.ok>=l.m?i:r,0);
let AC;function tone(f,d=.15,t=0,ty='sine'){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;o.connect(g);g.connect(AC.destination);const s=AC.currentTime+t;g.gain.setValueAtTime(.2,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(e){}}
const sOk=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,i*.1)),sBad=()=>{tone(180,.3,0,'sawtooth');tone(140,.3,.15,'sawtooth')},sLv=()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.2,i*.12));
function fx(a=['🎉','⭐','✨','💎','🌟']){for(let i=0;i<26;i++){const e=document.createElement('span');e.className='fx';e.textContent=a[i%a.length];e.style.left=Math.random()*95+'%';e.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3000)}}
const logo='<div class="logo"><span>🌸</span>لميس ياسمين عصام<span>⭐</span></div>';
function col(a,b,r,h){r=r||{t:'',u:''};const t=n=>n>=10?ar(Math.floor(n/10)):'',u=n=>ar(n%10),c=k=>h==k?' class="h"':'';
return`<table class="col"><tr><th>عشرات</th><th>آحاد</th><th></th></tr><tr><td${c('t')}>${t(a)}</td><td${c('u')}>${u(a)}</td><td class="pl"></td></tr><tr><td${c('t')}>${t(b)}</td><td${c('u')}>${u(b)}</td><td class="pl">+</td></tr><tr class="rs"><td${c('t')}>${r.t}</td><td${c('u')}>${r.u}</td><td class="pl"></td></tr></table>`}
const res=n=>({t:n>=10?ar(Math.floor(n/10)):'',u:ar(n%10)});
function bl(n){return`<div class="bl"><div>${'<i class="rod"></i>'.repeat(Math.floor(n/10))}</div><div>${'<i class="cube"></i>'.repeat(n%10)}</div></div>`}
function head(){const l=lv(),nx=L[l+1],p=nx?Math.min(100,(G.ok-L[l].m)/(nx.m-L[l].m)*100):100;
return logo+`<div class="card"><div class="bar"><span class="pill">👤 ${G.name}</span><span class="pill">⭐ ${ar(G.score)}</span><span class="pill">${L[l].i} المستوى ${L[l].n}</span></div><div class="prog"><i style="width:${p}%"></i></div></div>`}
function stepsFor(a,b,k){const ua=a%10,ub=b%10,ta=Math.floor(a/10),tb=Math.floor(b/10),c=a+b;return[
{x:`الخطوة ١: اكتب العددين، الآحاد تحت الآحاد والعشرات تحت العشرات.`+(b<10?' العدد المكوّن من رقم واحد نكتبه في خانة الآحاد فقط!':''),h:col(a,b),b:bl(a)+`<small>${ar(a)}</small>`},
{x:`الخطوة ٢: اجمع الآحاد: ${ar(ua)} + ${ar(ub)} = ${ar(ua+ub)}`,h:col(a,b,{t:'',u:ar(ua+ub)},'u'),b:''},
{x:`الخطوة ٣: اجمع العشرات: ${ar(ta)} + ${ar(tb)} = ${ar(ta+tb)}`+(tb?'':' (لا توجد عشرات في العدد الثاني، فننزل العشرات كما هي)'),h:col(a,b,res(c),'t'),b:''},
{x:`ممتاز يا ${G.name}! ${ar(ua+ub)} آحاد، ${ar(ta+tb)} عشرات = ${ar(c)}`,h:`<h2 class="ok">${ar(a)} + ${ar(b)} = ${ar(c)}</h2>`,b:bl(c)}]}
const LS=[{x:`مرحبًا يا ${G.name}! 🎉 اليوم سنتعلم الجمع الرأسي ونلعب ونجمع النجوم والمستويات!`,h:'<div class="big">🧮</div>',b:''},
{x:'الطريقة الرأسية: نكتب الأعداد رأسيًا حسب القيمة المكانية. وعند الجمع نبدأ بخانة الآحاد ثم خانة العشرات.',h:col(15,24),b:''},
{x:'الجزء الأول: جمع عددين كل منهما من رقمين. مثال: ١٥ + ٢٤',h:'<div class="big">1️⃣</div>',b:''},...stepsFor(15,24),
{x:'الجزء الثاني: جمع عدد من رقمين مع عدد من رقم واحد. مثال: ٣٢ + ٥',h:'<div class="big">2️⃣</div>',b:''},...stepsFor(32,5),
{x:`لاحظ يا ${G.name}: العدد المكوّن من رقم واحد نكتبه في خانة الآحاد. أنت جاهز للعب! 🚀`,h:'<div class="big">🏆</div>',b:''}];
function name(){app.innerHTML=logo+`<div class="card"><div class="big">👋</div><h1>لعبة الجمع الرأسي</h1><p>اكتب اسمك لنبدأ الرحلة:</p><input class="nm" id="nm" maxlength="20" placeholder="اسمك هنا"><br><button onclick="go()">ابدأ 🚀</button></div>`}
function go(){const v=document.getElementById('nm').value.trim();if(!v){document.getElementById('nm').classList.add('shake');return}G.name=v;tone(660);lesson()}
function lesson(){const s=LS[G.ls];app.innerHTML=logo+`<div class="card"><div class="sec">الشرح ${ar(G.ls+1)} / ${ar(LS.length)}</div><p>${s.x}</p>${s.h}${s.b}<div>${G.ls?'<button class="s" onclick="G.ls--;lesson()">السابق ▶</button>':''}${G.ls<LS.length-1?'<button onclick="G.ls++;tone(600);lesson()">التالي ◀</button>':'<button class="g" onclick="play()">ابدأ اللعب 🎮</button>'}</div></div>`}
function play(){G.mode='game';G.i=G.i||0;show()}
function exam(){G.mode='exam';G.es=0;G.i=0;const n=P.filter(p=>!p.t).sort(()=>Math.random()-.5).slice(0,7),w=P.filter(p=>p.t).sort(()=>Math.random()-.5).slice(0,3);G.ex=[...n,...w].sort(()=>Math.random()-.5);show()}
function show(){const Q=G.mode=='exam'?G.ex:P,q=Q[G.i];if(!q)return G.mode=='exam'?result():finish();G.buf='';G.tries=0;G.lock=0;G.ph='u';
const hd=G.mode=='exam'?logo+`<div class="card"><div class="bar"><span class="pill">👤 ${G.name}</span><span class="pill">📝 الاختبار</span><span class="pill">✅ ${ar(G.es)}</span></div></div>`:head();
app.innerHTML=hd+`<div class="card"><div class="sec">${G.mode=='exam'?'اختبار':q.s} · سؤال ${ar(G.i+1)} من ${ar(Q.length)}</div>${q.t?`<p class="wp">${q.t}</p>`:`<p>اجمع بالطريقة الرأسية: ${ar(q.a)} + ${ar(q.b)}</p>${G.mode=='game'?'<div class="sec">اكتب الآحاد أولًا ثم العشرات (من اليمين إلى اليسار)</div>':''}`}<div id="cw">${col(q.a,q.b)}</div><div class="ans" id="ans">؟</div><div class="msg" id="msg">${G.mode=='exam'?'✏️ اكتب رقم الآحاد أولًا ثم رقم العشرات (من اليمين لليسار)':''}</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="key('${n}')">${ar(n)}</button>`).join('')}<button class="s" onclick="key('d')">⌫</button><button onclick="key('0')">٠</button><button class="g" onclick="key('ok')">✔</button></div>${G.mode=='game'?'<button class="s" onclick="exam()" style="margin-top:12px">📝 اذهب للاختبار</button>':''}</div>`}
function key(k){if(G.lock)return;if(k=='d')G.buf=G.buf.slice(0,-1);else if(k=='ok')return check();else if(G.buf.length<3)G.buf+=k;tone(440,.05);document.getElementById('ans').textContent=G.buf?ar(rv(G.buf)):'؟'}
function check(){if(!G.buf)return;const Q=G.mode=='exam'?G.ex:P,q=Q[G.i],c=q.a+q.b,m=document.getElementById('msg'),an=document.getElementById('ans'),ex=G.mode=='exam';
if(+rv(G.buf)==c){G.lock=1;sOk();fx();an.classList.add('pop');document.getElementById('cw').innerHTML=col(q.a,q.b,res(c));
if(ex)G.es++;else{G.score+=G.tries?5:10;G.ok++}
m.className='msg ok';m.textContent=`🎉 أحسنت يا ${G.name}! ${ar(q.a)} + ${ar(q.b)} = ${ar(c)}${q.u?' '+q.u:''}`;
const l=lv();if(!ex&&l>G.lvl){G.lvl=l;setTimeout(()=>{sLv();fx(['💎','🏆','🌟','🎊']);app.insertAdjacentHTML('beforeend',`<div class="ov" onclick="this.remove();G.i++;show()"><div class="card"><div class="big">${L[l].i}</div><h2>مبروك يا ${G.name}!</h2><p>وصلت إلى المستوى ${L[l].n}</p><button>تابع ▶</button></div></div>`)},900);return}
setTimeout(()=>{G.i++;show()},1700)}
else{sBad();an.classList.add('shake');G.tries++;m.className='msg no';
if(ex){G.lock=1;m.textContent=`❌ الإجابة الصحيحة ${ar(c)}`;setTimeout(()=>{G.i++;show()},1800)}
else if(G.tries==1){m.textContent='❌ حاول مرة أخرى! ابدأ بجمع الآحاد ثم العشرات';document.getElementById('cw').innerHTML=col(q.a,q.b,null,'u');G.buf='';an.textContent='؟';setTimeout(()=>an.classList.remove('shake'),500)}
else{G.lock=1;document.getElementById('cw').innerHTML=col(q.a,q.b,res(c));m.textContent=`💡 الإجابة الصحيحة ${ar(c)} — ركّز في المرة القادمة!`;setTimeout(()=>{G.i++;show()},2600)}}}
function exStep(q,c,m,an){const u=(q.a%10)+(q.b%10),t=Math.floor(q.a/10)+Math.floor(q.b/10),pu=G.ph=='u',want=pu?u:t;
if(+rv(G.buf)==want){tone(880,.1);
if(pu){G.ph='t';sOk();document.getElementById('cw').innerHTML=col(q.a,q.b,{t:'',u:ar(u)},'t');m.className='msg ok';m.textContent='✅ أحسنت! الخطوة ٢: اكتب ناتج جمع العشرات';G.buf='';an.textContent='؟';return}
G.lock=1;G.es++;sOk();fx();an.classList.add('pop');document.getElementById('cw').innerHTML=col(q.a,q.b,res(c));m.className='msg ok';m.textContent=`🎉 أحسنت يا ${G.name}! ${ar(q.a)} + ${ar(q.b)} = ${ar(c)}${q.u?' '+q.u:''}`;setTimeout(()=>{G.i++;show()},1700);return}
sBad();an.classList.add('shake');G.lock=1;document.getElementById('cw').innerHTML=col(q.a,q.b,res(c));m.className='msg no';m.textContent=`❌ ${pu?'ناتج جمع الآحاد':'ناتج جمع العشرات'} الصحيح ${ar(want)} — والناتج النهائي ${ar(c)}`;setTimeout(()=>{G.i++;show()},2400)}
function finish(){sLv();fx();app.innerHTML=head()+`<div class="card"><div class="big">🏆</div><h1>أحسنت يا ${G.name}!</h1><p>أنهيت كل مسائل الدرس وجمعت ${ar(G.score)} نقطة</p><button class="g" onclick="exam()">📝 ابدأ الاختبار (١٠ مسائل)</button><button class="s" onclick="G.i=0;G.ls=0;lesson()">🔁 أعد الشرح</button></div>`}
function result(){const s=G.es,st=s>=9?'🌟🌟🌟':s>=7?'🌟🌟':s>=5?'🌟':'💪';s>=5?(sLv(),fx()):sBad();
app.innerHTML=logo+`<div class="card"><div class="big">${st}</div><h1>${s>=7?'ممتاز':s>=5?'جيد':'حاول مرة أخرى'} يا ${G.name}!</h1><h2>نتيجتك: ${ar(s)} من ${ar(10)}</h2><p>${s==10?'درجة كاملة! أنت بطل الجمع 🏅':s>=5?'عمل رائع، استمر!':'تدرّب أكثر وستنجح 💪'}</p><button class="g" onclick="exam()">🔄 اختبار جديد</button><button class="s" onclick="G.mode='game';show()">🎮 العودة للعب</button></div>`}
name();
</script></body></html>
